<style>

<div class="wrap">
  <h1>📘 我的工作日志</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="搜索日志…">
    <span id="count"></span>
  </div>
  <div id="test"></div>
  <main id="list"></main>
</div>
<script>
"use strict";
// 一行以日期开头就算一天：日期 + 空格 + 内容（内容可省略，也可换行续写）
// 空行 = 周分隔：空行隔开的各段按“周”分组显示
const DATE_RE = /^\s*(\d{4})[.\/年](\d{1,2})[.\/月](\d{1,2})日?\s*(.*)$/;
const pad = n => String(+n).padStart(2, "0");

function parseLog(text) {
  const groups = [];
  let cur = null, group = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(DATE_RE);
    if (m) {
      cur = { key: +m[1] * 10000 + +m[2] * 100 + +m[3], date: `${m[1]}.${pad(m[2])}.${pad(m[3])}`, lines: m[4] ? [m[4]] : [] };
      if (!group) { group = []; groups.push(group); }
      group.push(cur);
    } else if (line.trim()) {
      if (cur) cur.lines.push(line); // 长备注换行续写
    } else {
      cur = null; group = null; // 空行：结束当天与本周
    }
  }
  for (const g of groups) g.sort((a, b) => b.key - a.key);      // 周内新的在前
  return groups.sort((a, b) => b[0].key - a[0].key);            // 周也新的在前
}

const groups = parseLog(document.getElementById("log").textContent);
const allDays = groups.flat();
const list = document.getElementById("list");
const q = document.getElementById("q");
const count = document.getElementById("count");

function render() {
  const kw = q.value.trim().toLowerCase();
  const hit = e => !kw || (e.date + "\n" + e.lines.join("\n")).toLowerCase().includes(kw);
  const shown = groups.map(g => g.filter(hit)).filter(g => g.length);
  count.textContent = allDays.length ? `${shown.reduce((n, g) => n + g.length, 0)}/${allDays.length} 天` : "";
  list.textContent = "";
  const msg = t => { const p = document.createElement("p"); p.className = "empty"; p.textContent = t; list.appendChild(p); };
  if (!allDays.length) { msg("还没有日志：用记事本/VSCode 打开本文件，最上方的“日志区”加一行即可。"); return; }
  for (const g of shown) {
    const sec = document.createElement("section"); sec.className = "week";
    const h = document.createElement("h2");
    const range = g.length === 1 ? g[0].date.slice(5) : `${g[g.length - 1].date.slice(5)} – ${g[0].date.slice(5)}`;
    h.textContent = `${range} · ${g.length}天`;
    sec.appendChild(h);
    for (const e of g) {
      const row = document.createElement("div"); row.className = "entry";
      const d = document.createElement("span"); d.className = "d"; d.textContent = e.date;
      const c = document.createElement("div"); c.className = "c"; c.textContent = e.lines.join("\n");
      row.append(d, c);
      sec.appendChild(row);
    }
    list.appendChild(sec);
  }
  if (!shown.length) msg(`没有匹配“${q.value.trim()}”的日志`);
}
q.addEventListener("input", render);
render();

// 自检：地址栏加 ?test 运行，应显示绿色 ✓
if (location.search.includes("test")) {
  const t = document.getElementById("test");
  const gs = parseLog("2026.10.05 A\n续写\n\n2026.09.30 C");
  const ok = gs.length === 2 && gs[0].length === 1 && gs[0][0].lines.length === 2 && gs[1][0].lines[0] === "C";
  t.className = ok ? "ok" : "fail";
  t.textContent = ok ? "✓ 自检通过" : "✗ 自检失败";
}
</script>
